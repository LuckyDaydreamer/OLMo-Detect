<svg width="720" height="210" viewBox="0 0 720 210" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="OLMo-Detect">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4F8DFD"/>
      <stop offset="1" stop-color="#7C5CFC"/>
    </linearGradient>
  </defs>

  <!-- ICON: a single sample checked against a large training corpus -->
  <g transform="translate(24,12)">

    <!-- CORPUS: a tall stack of documents (offset sheets) -->
    <rect x="14" y="20" width="92" height="150" rx="12" fill="#DCE7FB" stroke="url(#g)" stroke-width="3"/>
    <rect x="8"  y="12" width="92" height="150" rx="12" fill="#EAF1FF" stroke="url(#g)" stroke-width="3"/>
    <rect x="2"  y="4"  width="92" height="150" rx="12" fill="#FFFFFF" stroke="url(#g)" stroke-width="3.5"/>
    <!-- corpus text lines -->
    <rect x="16" y="26" width="64" height="7" rx="3.5" fill="#BFD2F2"/>
    <rect x="16" y="44" width="64" height="7" rx="3.5" fill="#BFD2F2"/>
    <rect x="16" y="62" width="64" height="8" rx="4"   fill="url(#g)"/>   <!-- verbatim match line in corpus -->
    <rect x="16" y="80" width="64" height="7" rx="3.5" fill="#BFD2F2"/>
    <rect x="16" y="98" width="44" height="7" rx="3.5" fill="#BFD2F2"/>

    <!-- SAMPLE: one small document being tested -->
    <rect x="120" y="78" width="74" height="92" rx="11" fill="#FFFFFF" stroke="url(#g)" stroke-width="4"/>
    <rect x="132" y="96"  width="46" height="7" rx="3.5" fill="#BFD2F2"/>
    <rect x="132" y="112" width="46" height="8" rx="4"   fill="url(#g)"/>   <!-- the SAME verbatim line -->
    <rect x="132" y="128" width="34" height="7" rx="3.5" fill="#BFD2F2"/>

    <!-- match link: corpus line  ->  sample line -->
    <path d="M82 66 C104 66, 104 116, 130 116" fill="none" stroke="url(#g)" stroke-width="3" stroke-dasharray="2 5" stroke-linecap="round"/>

    <!-- detection badge -->
    <circle cx="186" cy="160" r="18" fill="url(#g)"/>
    <path d="M178 160 l6 7 11 -14" fill="none" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- WORDMARK -->
  <text x="248" y="120" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="58" font-weight="800" fill="#1b2330">OLMo<tspan fill="url(#g)">-Detect</tspan></text>
</svg>
