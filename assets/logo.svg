<svg width="760" height="220" viewBox="0 0 760 220" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="OLMo-Detect">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4F8DFD"/>
      <stop offset="1" stop-color="#7C5CFC"/>
    </linearGradient>
  </defs>

  <!-- ICON: a small evaluation sample checked against a LARGE training corpus -->
  <g transform="translate(26,12)">

    <!-- CORPUS: a big, obvious multi-sheet stack (clearly large) -->
    <rect x="26" y="34" width="116" height="170" rx="14" fill="#CFDFFA" stroke="url(#g)" stroke-width="3"/>
    <rect x="16" y="22" width="116" height="170" rx="14" fill="#E2ECFE" stroke="url(#g)" stroke-width="3"/>
    <rect x="6"  y="10" width="116" height="170" rx="14" fill="#FFFFFF" stroke="url(#g)" stroke-width="4"/>
    <!-- corpus text lines (many) -->
    <rect x="22" y="34"  width="84" height="8" rx="4" fill="#BFD2F2"/>
    <rect x="22" y="54"  width="84" height="8" rx="4" fill="#BFD2F2"/>
    <rect x="22" y="74"  width="84" height="9" rx="4.5" fill="url(#g)"/>   <!-- verbatim match in corpus -->
    <rect x="22" y="95"  width="84" height="8" rx="4" fill="#BFD2F2"/>
    <rect x="22" y="115" width="84" height="8" rx="4" fill="#BFD2F2"/>
    <rect x="22" y="135" width="60" height="8" rx="4" fill="#BFD2F2"/>
    <!-- corpus label -->
    <text x="64" y="170" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#7C90B5" text-anchor="middle">training corpus</text>

    <!-- SAMPLE: one small, tilted document, clearly tiny next to the corpus -->
    <g transform="translate(150,86) rotate(6)">
      <rect x="0" y="0" width="62" height="78" rx="10" fill="#FFFFFF" stroke="url(#g)" stroke-width="3.5"/>
      <rect x="12" y="14" width="38" height="6" rx="3" fill="#BFD2F2"/>
      <rect x="12" y="28" width="38" height="7" rx="3.5" fill="url(#g)"/>   <!-- the SAME verbatim line -->
      <rect x="12" y="42" width="28" height="6" rx="3" fill="#BFD2F2"/>
    </g>

    <!-- match link: corpus match line  ->  sample match line -->
    <path d="M106 78 C135 78, 140 116, 162 116" fill="none" stroke="url(#g)" stroke-width="3" stroke-dasharray="2 5" stroke-linecap="round"/>

    <!-- detection badge -->
    <circle cx="206" cy="172" r="18" fill="url(#g)"/>
    <path d="M198 172 l6 7 11 -14" fill="none" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- WORDMARK -->
  <text x="288" y="126" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="58" font-weight="800" fill="#1b2330">OLMo<tspan fill="url(#g)">-Detect</tspan></text>
</svg>
